  #toolbar{
    position:fixed;

    z-index:3;
    background:rgba(0,0,0,.55);
    border:1px solid #333;border-radius:12px;
    padding:8px 10px;
    backdrop-filter:blur(2px);

    min-width: 180px !important;

    transform-origin:bottom right;
    -webkit-tap-highlight-color: transparent;

    max-height: calc(100vh - (70px + env(safe-area-inset-bottom) + env(safe-area-inset-top)));
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;

    padding-bottom: calc(8px + env(safe-area-inset-bottom));

  #toolbar button{

  #toolbar button:active{ transform: scale(0.98); }
  #toolbar button:hover{background:#2b2b2b}

  #toolbar-toggle{
    position:fixed;
    bottom: calc(10px + env(safe-area-inset-bottom));
    right:  calc(10px + env(safe-area-inset-right));

    display:flex;align-items:center;justify-content:center;

  #toast {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));

    border-radius: 12px;
    padding: 10px 14px;

  }
  #toast.show {
    opacity: 1;

  }

  /* Export file picker modal (ADDED) */
  #filePickerModal {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10001;

  }
  #filePickerModal.show { display: flex; }

  .filePickerCard {
    width: min(92vw, 460px);
    background: rgba(0,0,0,.78);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 14px;
    padding: 12px;
    color: #fff;
    font: 14px/1.25 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  }
  .filePickerTitle {
    font-weight: 700;

  .filePickerBtn.primary {

  /* Show normal cursor over picker */

<script>
document.addEventListener("DOMContentLoaded", () => {
  const playlist = [
    { title: "tttheme2", src: "music/tttheme2.mp3" },
    { title: "5432gone_redfarn", src: "music/5432gone_redfarn.mp3" },
    { title: "be_sharp_bw_redfarn", src: "music/be_sharp_bw_redfarn.mp3" },
    { title: "big_man_boogie_redfarn", src: "music/big_man_boogie_redfarn.mp3" },
    { title: "boogi_marabi_redfarn", src: "music/boogi_marabi_redfarn.mp3" },
    { title: "busy_schedule", src: "music/busy_schedule.mp3" },
    { title: "careless_perc_redfarn", src: "music/careless_perc_redfarn.mp3" },
    { title: "chemistry_lab", src: "music/chemistry_lab.mp3" },
    { title: "chuggachugga", src: "music/chuggachugga.mp3" },
    { title: "city_blues_redfarn", src: "music/city_blues_redfarn.mp3" },
    { title: "coconut_run2", src: "music/coconut_run2.mp3" },
    { title: "flying_scotsman", src: "music/flying_scotsman.mp3" },
    { title: "harp_harmony", src: "music/harp_harmony.mp3" },
    { title: "linns_basket", src: "music/linns_basket.mp3" },
    { title: "midnight_snow_run", src: "music/midnight_snow_run.mp3" },
    { title: "mighty_giant_run", src: "music/mighty_giant_run.mp3" },
    { title: "modern_motion", src: "music/modern_motion.mp3" },
    { title: "moo_redfarn", src: "music/moo_redfarn.mp3" },
    { title: "mosey_along_redfarn", src: "music/mosey_along_redfarn.mp3" },
    { title: "no_work_song_redfarn", src: "music/no_work_song_redfarn.mp3" },
    { title: "relax_song", src: "music/relax_song.mp3" },
    { title: "run_for_your_life", src: "music/run_for_your_life.mp3" },
    { title: "say_what_redfarn", src: "music/say_what_redfarn.mp3" },
    { title: "slow_neasy_redfarn", src: "music/slow_neasy_redfarn.mp3" },
    { title: "the_fast_route", src: "music/the_fast_route.mp3" },
    { title: "the_hobo_redfarn", src: "music/the_hobo_redfarn.mp3" },
    { title: "train_filled_with_cash", src: "music/train_filled_with_cash.mp3" },
    { title: "ttsong_iii_imuh3", src: "music/ttsong_iii_imuh3.mp3" },
    { title: "ttsong_iv_imuh3", src: "music/ttsong_iv_imuh3.mp3" },
    { title: "ultimate_run", src: "music/ultimate_run.mp3" },
    { title: "wood_whistles", src: "music/wood_whistles.mp3" }
  ];

  const audio = document.getElementById("audioElement");
  const ttdWindow = document.getElementById("ttdWindow");
  const openMusicBtn = document.getElementById("openMusicBtn");

  const playlistList = document.getElementById("playlistList");
  const playlistCountLabel = document.getElementById("playlistCountLabel");
  const playlistModeLabel = document.getElementById("playlistModeLabel");

  const btnPlayPause = document.getElementById("btnPlayPause");
  const btnPrev = document.getElementById("btnPrev");
  const btnNext = document.getElementById("btnNext");
  const btnShuffle = document.getElementById("btnShuffle");
  const btnRepeat = document.getElementById("btnRepeat");

  const currentTrackTitle = document.getElementById("currentTrackTitle");
  const progressBarWrap = document.getElementById("progressBarWrap");
  const progressBarFill = document.getElementById("progressBarFill");
  const currentTimeLabel = document.getElementById("currentTimeLabel");
  const durationLabel = document.getElementById("durationLabel");

  const btnClose = document.getElementById("btnClose");
  const header = document.getElementById("ttdWindowHeader");

  let currentIndex = 0;
  let isShuffle = false;
  let isRepeat = false;

  let toastTimer = null;
  window.__toast = function(msg, ms=1600){
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>el.classList.remove('show'), ms);
  };

  let firstPlayArmed = true;
  document.addEventListener("click", function onFirstClick() {
    if (!firstPlayArmed) return;
    firstPlayArmed = false;
    audio.play().catch(()=>{});
    document.removeEventListener("click", onFirstClick, true);
  }, { capture: true });

  function loadTrack(index, autoplay = false) {
    currentIndex = index;
    const track = playlist[index];
    audio.src = track.src;
    currentTrackTitle.textContent = track.title;
    highlightActive();
    if (autoplay) audio.play().catch(()=>{});
  }

  function highlightActive() {
    document.querySelectorAll(".playlist-item").forEach(el => {
      el.classList.toggle("active", parseInt(el.dataset.index, 10) === currentIndex);
    });
  }

  function buildPlaylist() {
    playlistList.innerHTML = "";
    playlist.forEach((track, i) => {
      const item = document.createElement("div");
      item.className = "playlist-item";
      item.textContent = track.title;
      item.dataset.index = i;
      item.onclick = () => loadTrack(i, true);
      playlistList.appendChild(item);
    });
    playlistCountLabel.textContent = playlist.length + " tracks";
    playlistModeLabel.textContent = "";
  }

  function nextTrack(auto = false) {
    if (isRepeat && auto) { loadTrack(currentIndex, true); return; }
    if (isShuffle) {
      let r; do r = Math.floor(Math.random() * playlist.length); while (r === currentIndex);
      loadTrack(r, true);
    } else {
      currentIndex = (currentIndex + 1) % playlist.length;
      loadTrack(currentIndex, true);
    }
  }
  function prevTrack() {
    if (isShuffle) {
      let r; do r = Math.floor(Math.random() * playlist.length); while (r === currentIndex);
      loadTrack(r, true);
    } else {
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      loadTrack(currentIndex, true);
    }
  }

  function bindTransportButton(btn, handler) {
    if (!btn) return;
    btn.addEventListener("click", (e) => { e.preventDefault(); handler(); });
    btn.addEventListener("touchend", (e) => { e.preventDefault(); handler(); }, { passive: false });
  }
  bindTransportButton(btnNext, () => nextTrack(false));
  bindTransportButton(btnPrev, prevTrack);

  function updatePlayPauseIcon() {
    if (!audio) return;
    btnPlayPause.innerHTML = audio.paused ? "&#9658;" : "&#10074;&#10074;";
  }

  btnPlayPause.onclick = () => { audio.paused ? audio.play().catch(()=>{}) : audio.pause(); };
  audio.addEventListener("play", updatePlayPauseIcon);
  audio.addEventListener("pause", updatePlayPauseIcon);

  btnShuffle.onclick = () => { isShuffle = !isShuffle; btnShuffle.classList.toggle("toggle-on", isShuffle); };
  btnRepeat.onclick  = () => { isRepeat  = !isRepeat;  btnRepeat.classList.toggle("toggle-on", isRepeat); };

  progressBarWrap.onclick = (e) => {
    const rect = progressBarWrap.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    if (!isNaN(audio.duration) && audio.duration > 0) audio.currentTime = ratio * audio.duration;
  };

  audio.ontimeupdate = () => {
    currentTimeLabel.textContent = formatTime(audio.currentTime);
    durationLabel.textContent = formatTime(audio.duration);
    if (!isNaN(audio.duration) && audio.duration > 0) {
      progressBarFill.style.width = (audio.currentTime / audio.duration) * 100 + "%";
    } else {
      progressBarFill.style.width = "0%";
    }
  };
  audio.onended = () => nextTrack(true);

  function formatTime(s) {
    if (isNaN(s)) return "0:00";
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, "0");
    return m + ":" + sec;
  }

  let isDragging = false;
  let dragStartX = 0, dragStartY = 0;
  let startLeft = 0, startTop = 0;

  function getWindowRect() {
    const rect = ttdWindow.getBoundingClientRect();
    return { width: rect.width, height: rect.height };
  }
  function startDrag(clientX, clientY) {
    isDragging = true;
    dragStartX = clientX;
    dragStartY = clientY;
    const computed = window.getComputedStyle(ttdWindow);
    startLeft = parseInt(computed.left, 10) || ttdWindow.offsetLeft || 0;
    startTop  = parseInt(computed.top, 10)  || ttdWindow.offsetTop  || 0;
  }
  function performDrag(clientX, clientY) {
    if (!isDragging) return;
    let newLeft = startLeft + (clientX - dragStartX);
    let newTop  = startTop  + (clientY - dragStartY);

    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const rect = getWindowRect();
    const maxLeft = winW - rect.width;
    const maxTop  = winH - rect.height;

    newLeft = Math.min(Math.max(newLeft, 0), Math.max(maxLeft, 0));
    newTop  = Math.min(Math.max(newTop, 0), Math.max(maxTop, 0));

    ttdWindow.style.left = newLeft + "px";
    ttdWindow.style.top  = newTop + "px";
  }
  function endDrag() { isDragging = false; }

  header.addEventListener("pointerdown", (e) => {
    if (e.target.closest("#btnClose")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    startDrag(e.clientX, e.clientY);
    header.setPointerCapture(e.pointerId);
  });
  header.addEventListener("pointermove", (e) => { if (isDragging) performDrag(e.clientX, e.clientY); });
  header.addEventListener("pointerup", (e) => { if (!isDragging) return; endDrag(); try { header.releasePointerCapture(e.pointerId); } catch(_) {} });
  header.addEventListener("pointercancel", (e) => { if (!isDragging) return; endDrag(); try { header.releasePointerCapture(e.pointerId); } catch(_) {} });

  openMusicBtn.onclick = () => { ttdWindow.style.display = "flex"; audio.play().catch(()=>{}); };

  btnClose.onclick = () => { ttdWindow.style.display = "none"; };
  btnClose.addEventListener("touchend", (e) => { e.preventDefault(); ttdWindow.style.display = "none"; });

  buildPlaylist();
  loadTrack(0, false);
  audio.volume = 0.6;
  updatePlayPauseIcon();
});
</script>

  <script>
    (function(){
      var M = window.Module || {};
      if (!Array.isArray(M.preRun))     M.preRun = [];
      if (!Array.isArray(M.postRun))    M.postRun = [];
      if (!Array.isArray(M.arguments))  M.arguments = [];

    function ensureIDBMounted() {
      return new Promise((resolve) => {
        try {
          const prev = (() => { try { return localStorage.getItem(BUILD_KEY); } catch(_) { return null; } })();
          const changed = prev && prev !== BUILD_ID;

          if (changed) {
            clearPersistentCachesOnBuildChange();
            try { localStorage.setItem(BUILD_KEY, BUILD_ID); } catch(_) {}
            __idbReady = false;
          } else if (!prev) {
            try { localStorage.setItem(BUILD_KEY, BUILD_ID); } catch(_) {}
          }

          if (typeof FS === 'undefined' || typeof IDBFS === 'undefined') return resolve();
          if (__idbReady) return resolve();

          mkdirp(IDB_ROOT);
          let mounted = false;
          try { mounted = !!FS.lookupPath(IDB_ROOT).node.mounted; } catch(_) {}
          if (!mounted) FS.mount(IDBFS, {}, IDB_ROOT);

          FS.syncfs(true, (err) => {
            if (err) { console.error('IDBFS initial sync failed', err); return resolve(); }
            __idbReady = true;
            if (exists(IDB_MIRROR)) {
              mkdirp(LIVE_ROOT);
              copyTree(IDB_MIRROR, LIVE_ROOT);
            }
            resolve();
          });
        } catch (e) {
          console.error('IDBFS mount error', e);
          resolve();
        }
      });
    }

    function newestByMtime(dir, exts){
      try{
        const items = FS.readdir(dir)
          .filter(f=>f!=='.'&&f!=='..')
          .filter(f=>{
            const low=f.toLowerCase();
            return (Array.isArray(exts)? exts : [exts]).some(ext=>low.endsWith(ext));
          });
        if(!items.length) return null;
        let best = items[0], t = 0;
        for(const f of items){ const st=FS.stat(dir+f); if(st && st.mtime>t){ best=f; t=st.mtime; } }
        return best;
      }catch(_){ return null; }
    }

    async function shareOrDownload(name, data, type='application/octet-stream', preferOpen=false){
      try{
        const file = new File([data], name, { type });
        if (navigator.canShare && navigator.canShare({ files:[file] })) {

      if (preferOpen) openBlobURLInNewContext(url);
      else {
        const a=document.createElement('a');
        a.href=url; a.download=name; a.rel='noopener';
        document.body.appendChild(a); a.click();

    function listFilesInDirSorted(dir, exts){
      try{
        const want = Array.isArray(exts) ? exts : [exts];
        const items = FS.readdir(dir)
          .filter(f=>f!=='.'&&f!=='..')
          .filter(f=>{
            const low = f.toLowerCase();
            return want.some(ext => low.endsWith(ext));
          });

        const withTimes = items.map(name=>{
          const p = dir + name;
          let t = 0;
          try { const st = FS.stat(p); t = st && st.mtime ? st.mtime : 0; } catch(_) {}
          return { name, t };
        });

        withTimes.sort((a,b)=>(b.t||0)-(a.t||0));
        return withTimes.map(x=>x.name);
      }catch(_){
        return [];
      }
    }

      tEl.textContent = title || 'Choose a file';

      for (const opt of options){
        const o = document.createElement('option');
        o.value = opt.value;
        o.textContent = opt.label;
        sel.appendChild(o);
      }

      function close(){
        modal.classList.remove('show');
        modal.setAttribute('aria-hidden', 'true');
        document.removeEventListener('keydown', onKeyDown);
        modal.removeEventListener('click', onBackdropClick);
        btnOk.onclick = null;

      btnOk.onclick = () => {
        const v = sel.value;
        close();
        onPick(v);
      };
      btnCan.onclick = () => close();

      modal.addEventListener('click', onBackdropClick);
      document.addEventListener('keydown', onKeyDown);

      modal.classList.add('show');
      modal.setAttribute('aria-hidden', 'false');

      setTimeout(()=>{ try{ sel.focus(); }catch(_){} }, 0);

      dir,

      title,
      sub,
      mimeForName,
      preferOpen=true

        const names = listFilesInDirSorted(dir, exts);
        if (!names.length){
          alert('No matching file found in ' + dir);

        if (names.length === 1){
          const name = names[0];
          const data = FS.readFile(dir + name);
          const type = (mimeForName ? mimeForName(name) : 'application/octet-stream');
          await shareOrDownload(name, data, type, preferOpen);
          return;
        }

        const options = names.map(n => ({ value: n, label: n }));

        showFilePickerModal({
          title: title || 'Choose a file to export',
          sub: sub || ('From: ' + dir),
          options,
          onPick: async (pickedName) => {
            try{
              const data = FS.readFile(dir + pickedName);
              const type = (mimeForName ? mimeForName(pickedName) : 'application/octet-stream');
              await shareOrDownload(pickedName, data, type, preferOpen);
            }catch(e){
              alert('Export failed: ' + (e && e.message ? e.message : e));

          }
        });

        alert('Export failed: ' + (e && e.message ? e.message : e));

    function isInBackupScope(path){
      if (path === LIVE_ROOT + '/openttd.cfg') return true;
      if (path.startsWith(SAVE_DIR)) return true;
      if (path.startsWith(SCEN_DIR)) return true;
      if (path.startsWith(HEIGHT_DIR)) return true;
      return false;
    }

    function toBase64(u8){
      let bin = '';
      const chunk = 0x8000;
      for (let i = 0; i < u8.length; i += chunk) {
        bin += String.fromCharCode.apply(null, u8.subarray(i, i + chunk));
      }
      return btoa(bin);
    }
    function fromBase64(b64){
      const bin = atob(b64);
      const out = new Uint8Array(bin.length);
      for (let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function listFilesRecursive(dir){
      const out = [];
      const names = readdirSafe(dir);
      for (const name of names){
        const full = dir.replace(/\/+$/,'') + '/' + name;
        try{
          const st = FS.stat(full);
          if (st.mode && (st.mode & 0x4000)) out.push(...listFilesRecursive(full));
          else out.push(full);
        }catch(_) {}
      }
      return out;
    }

    function takeMostRecent(paths, maxN){
      const withTimes = [];
      for (const p of paths){
        try{
          const st = FS.stat(p);
          withTimes.push({ p, t: st && st.mtime ? st.mtime : 0 });
        }catch(_) {}
      }
      withTimes.sort((a,b)=> (b.t||0) - (a.t||0));
      return withTimes.slice(0, maxN).map(x=>x.p);
    }

    function collectBackupPayload(){
      mkdirp(LIVE_ROOT);

      const files = [];
      const candidates = new Set();

      candidates.add(LIVE_ROOT + '/openttd.cfg');

      if (exists(SAVE_DIR))   listFilesRecursive(SAVE_DIR).forEach(p=>candidates.add(p));
      if (exists(SCEN_DIR))   listFilesRecursive(SCEN_DIR).forEach(p=>candidates.add(p));
      if (exists(HEIGHT_DIR)) listFilesRecursive(HEIGHT_DIR).forEach(p=>candidates.add(p));

      const cfg = [LIVE_ROOT + '/openttd.cfg'].filter(p=>exists(p));
      const saves   = takeMostRecent([...candidates].filter(p=>p.startsWith(SAVE_DIR)), 5);
      const scens   = takeMostRecent([...candidates].filter(p=>p.startsWith(SCEN_DIR) && p.toLowerCase().endsWith('.scn')), 5);
      const heights = takeMostRecent([...candidates].filter(p=>p.startsWith(HEIGHT_DIR)), 5);

      const finalList = [...cfg, ...saves, ...scens, ...heights];

      for (const path of finalList){
        if (!isInBackupScope(path)) continue;
        try{
          const data = FS.readFile(path);
          files.push({ path, b64: toBase64(data) });
        }catch(_) {}
      }

      return { v: 1, ts: Date.now(), files };
    }

    function nativeBackupHandler(){
      return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.otBackup;
    }
    function nativeRestoreHandler(){
      return window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.otRestore;
    }

    async function backupNow(opts={ silent:false }){
      try{
        if (typeof FS === 'undefined') return;

        await ensureIDBMounted().catch(()=>{});
        await persistToIDB().catch(()=>{});

        const payload = collectBackupPayload();

        const h = nativeBackupHandler();
        if (h && h.postMessage) {
          h.postMessage(payload);
          if (!opts.silent) window.__toast && window.__toast('Backing up…');
          return;
        }

        const json = JSON.stringify(payload);
        const url = URL.createObjectURL(new Blob([json],{type:'application/json'}));
        const a=document.createElement('a');
        a.href=url; a.download='openttd-backup.json';
        document.body.appendChild(a); a.click();
        setTimeout(()=>{ URL.revokeObjectURL(url); try{document.body.removeChild(a);}catch(_){ } }, 0);
        if (!opts.silent) window.__toast && window.__toast('Backup downloaded');
      }catch(e){
        if (!opts.silent) alert('Backup failed: ' + (e && e.message ? e.message : e));
      }
    }

    async function applyBackupPayload(payload){
      if (!payload || !payload.files) throw new Error('Invalid backup');
      await ensureIDBMounted().catch(()=>{});
      if (typeof FS === 'undefined') return;

      mkdirp(LIVE_ROOT);
      mkdirp(SAVE_DIR);
      mkdirp(SCEN_DIR);
      mkdirp(HEIGHT_DIR);

      for (const f of payload.files){
        if (!f || !f.path || !f.b64) continue;
        if (!isInBackupScope(f.path)) continue;

        try{
          const bytes = fromBase64(f.b64);
          mkdirp(f.path.substring(0, f.path.lastIndexOf('/')));
          FS.writeFile(f.path, bytes);
        }catch(_) {}
      }

      await persistToIDB().catch(()=>{});
    }

    window.__applyBackupFromNative = async function(payload){
      try{
        await applyBackupPayload(payload);
        window.__toast && window.__toast('Backup restored', 1800);
        try { sessionStorage.setItem('__ot_silent_restore_done', '1'); } catch(_) {}
        setTimeout(()=>location.reload(), 350);
      }catch(e){
        alert('Restore failed: ' + (e && e.message ? e.message : e));
      }
    };

    window.__backupSucceededToast = function(){
      window.__toast && window.__toast('Backup succeeded', 1600);
    };

    function requestRestoreFromApp(){
      const h = nativeRestoreHandler();
      if (h && h.postMessage) {
        h.postMessage({ action:'request', silent:false });
        window.__toast && window.__toast('Restoring…');
      } else {
        alert('Restore is only available inside the iOS app build.');
      }
    }

    async function silentRestoreAfterBoot(){
      try{
        if (sessionStorage.getItem('__ot_silent_restore_done') === '1') return;
        sessionStorage.setItem('__ot_silent_restore_done', '1');
      }catch(_) {}

      const h = nativeRestoreHandler();
      if (h && h.postMessage) h.postMessage({ action:'request', silent:true });
    }

    let __backupTimer = null;
    let __backupSoonTimer = null;

    function scheduleAutoBackups(){
      if (__backupTimer) return;
      __backupTimer = setInterval(()=>{
        const h = nativeBackupHandler();
        if (h && h.postMessage) backupNow({ silent:true });
      }, 120000);
    }

    function scheduleBackupSoon(){
      clearTimeout(__backupSoonTimer);
      __backupSoonTimer = setTimeout(()=>{
        const h = nativeBackupHandler();
        if (h && h.postMessage) backupNow({ silent:true });
      }, 2500);
    }

    document.addEventListener('DOMContentLoaded', ()=>{
      const b1 = document.getElementById('btnBackupNow');
      const b2 = document.getElementById('btnRestoreBackup');
      if (b1) b1.addEventListener('click', ()=>backupNow({silent:false}));
      if (b2) b2.addEventListener('click', requestRestoreFromApp);
    });

    (function(){
      const prev = Module.onRuntimeInitialized;
      Module.onRuntimeInitialized = async function(){
        try { if (prev) prev(); } catch(_) {}

        await ensureIDBMounted().catch(()=>{});
        await persistToIDB().catch(()=>{});

        await silentRestoreAfterBoot();

        setTimeout(()=>backupNow({silent:true}), 4000);

        scheduleAutoBackups();
      };
    })();
  </script>

  <script>
  (function () {
    function updateCanvasScale() {
      const canvas = document.getElementById('canvas');
      if (!canvas) return;

      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const vw = window.innerWidth;
      const vh = window.innerHeight;

      const backingW = Math.floor(vw * dpr);
      const backingH = Math.floor(vh * dpr);

      canvas.width  = backingW;
      canvas.height = backingH;
      canvas.style.width  = vw + 'px';
      canvas.style.height = vh + 'px';

      if (typeof Module !== 'undefined' && Module.setCanvasSize) {
        Module.setCanvasSize(backingW, backingH, false);
      }

      canvas.tabIndex = 1;
      canvas.addEventListener('click', () => canvas.focus(), { once: true });
    }

    window.addEventListener('resize', updateCanvasScale);
    window.addEventListener('orientationchange', updateCanvasScale);
    document.addEventListener('DOMContentLoaded', updateCanvasScale);
    updateCanvasScale();
  })();
  </script>

  <script>
  (function(){
    const SENSITIVITY = 0.2;

    function attach(){
      const canvas = (window.Module && Module.canvas) || document.getElementById('canvas');
      if (!canvas) return false;

      canvas.style.touchAction = 'none';
      canvas.style.cursor = 'none';

      let pA = null, pB = null;
      let lastDist = 0;

      function pinchDist(t1, t2){
        return Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);
      }

      canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 2){
          e.preventDefault();
          pA = e.touches[0];
          pB = e.touches[1];
          lastDist = pinchDist(pA, pB);
        }
      }, {passive:false});

      canvas.addEventListener('touchmove', e => {
        if (e.touches.length !== 2) return;
        e.preventDefault();

        const t1 = e.touches[0], t2 = e.touches[1];
        const dist = pinchDist(t1, t2);
        const scale = dist / lastDist;

        if (Math.abs(scale - 1) > 0.01) {
          const cx = (t1.clientX + t2.clientX) / 2;
          const cy = (t1.clientY + t2.clientY) / 2;

          const delta = (Math.log(scale) / Math.log(1.05)) * 120 * SENSITIVITY;
          canvas.dispatchEvent(new WheelEvent('wheel', {
            deltaY: -delta,
            clientX: cx,
            clientY: cy,
            bubbles: true
          }));
          lastDist = dist;
        }
      }, {passive:false});

      canvas.addEventListener('touchend', e => {
        if (e.touches.length < 2) pA = pB = null;
      }, {passive:false});

      canvas.addEventListener('touchcancel', () => { pA = pB = null; }, {passive:false});

      return true;
    }

    if (!attach()){
      const prev = (window.Module && Module.onRuntimeInitialized) || null;
      window.Module = window.Module || {};
      Module.onRuntimeInitialized = function(){
        if (prev) prev();
        attach();
      };
      window.addEventListener('load', () => setTimeout(attach, 0));
    }
  })();
  </script>
